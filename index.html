<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    height:100vh;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:700px;
    height:100vh;
    background:white;
    display:flex;
    flex-direction:column;
}

header{
    padding:16px;
    background:#111;
    color:white;
    font-size:21px;
    font-weight:bold;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.msg{
    max-width:85%;
    padding:12px 15px;
    margin:10px 0;
    border-radius:15px;
    line-height:1.5;
    white-space:pre-wrap;
}

.user{
    margin-left:auto;
    background:#111;
    color:white;
}

.ai{
    background:#eeeeee;
    color:#111;
}

.bottom{
    display:flex;
    padding:10px;
    border-top:1px solid #ddd;
    gap:8px;
}

input{
    flex:1;
    padding:13px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

button{
    border:0;
    border-radius:12px;
    padding:0 18px;
    background:#111;
    color:white;
    font-size:16px;
}

button:active{
    transform:scale(.96);
}
</style>
</head>

<body>

<div class="app">

<header>
🤖 My AI
</header>

<div id="chat">

<div class="msg ai">
Hello! 👋
I am your AI assistant.
Ask me anything.
</div>

</div>

<div class="bottom">

<input
id="input"
placeholder="Ask something..."
autocomplete="off"
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");

input.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

function addMessage(text,type){

    const div = document.createElement("div");

    div.className = "msg " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage(){

    const message = input.value.trim();

    if(!message){
        return;
    }

    addMessage(message,"user");

    input.value = "";

    const loading = addMessage(
        "Thinking...",
        "ai"
    );

    try{

        const response = await fetch(
            "/api/chat",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:message
                })
            }
        );

        const data = await response.json();

        loading.remove();

        if(!response.ok){

            addMessage(
                data.error || "Something went wrong.",
                "ai"
            );

            return;
        }

        addMessage(
            data.reply,
            "ai"
        );

    }

    catch(error){

        loading.remove();

        addMessage(
            "Backend connected nahi hai.",
            "ai"
        );

    }

}

</script>

</body>
  </html>
